# Native tests of the program's portable core (ASan/UBSan) and the interface-string checks, on
# every push and pull request. The Amiga build needs vbcc, the NDK and the MUI headers, which are
# not installed on GitHub's runners: it is done on the build machine (see CLAUDE.md).
name: tests
on:
  push:
  pull_request:
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python with Pillow (icon sheet, fit checks)
        run: python3 -m pip install --user pillow
      - name: Native tests
        run: TMP=$RUNNER_TEMP sh tools/test.sh
